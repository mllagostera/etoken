org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# AGP 9 changed a pile of defaults, and ships Kotlin support of its own that
# refuses to coexist with the Kotlin Gradle Plugin -- the first CI run failed
# on exactly that (AgpWithBuiltInKotlinAppliedCheck). These are the flags
# commander-companion's android/ module carries against the same AGP 9.3.1 and
# Kotlin 2.4.10, which is the configuration this project's catalog was aligned
# to in the first place.
android.builtInKotlin=false
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

kotlin.code.style=official
